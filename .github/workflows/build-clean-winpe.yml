name: Build Clean WinPE

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-clean-winpe.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Microsoft ADK and WinPE add-on
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Install-WithRetry {
            param([string]$PackageName)
            for ($i = 1; $i -le 3; $i++) {
              Write-Host "Installing $PackageName, attempt $i of 3"
              choco install $PackageName -y --no-progress --execution-timeout=2700
              if ($LASTEXITCODE -eq 0) { return }
              if ($i -lt 3) { Start-Sleep -Seconds 15 }
            }
            throw "Failed to install $PackageName"
          }

          Install-WithRetry "windows-adk"
          Install-WithRetry "windows-adk-winpe"

      - name: Build untouched amd64 WinPE ISO
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
          call copype amd64 C:\WinPE_amd64
          call MakeWinPEMedia /ISO C:\WinPE_amd64 C:\WinPE_amd64\WinPE_amd64.iso

      - name: Record build information and SHA256
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $iso = "C:\WinPE_amd64\WinPE_amd64.iso"
          $hash = Get-FileHash -Algorithm SHA256 $iso
          $info = @(
            "Generated by Microsoft ADK and WinPE add-on on GitHub-hosted windows-latest runner"
            "No files were injected into the WinPE image after copype"
            "ISO=$iso"
            "SHA256=$($hash.Hash)"
            "Size=$((Get-Item $iso).Length)"
            "RunnerOS=$env:RUNNER_OS"
            "RunnerArch=$env:RUNNER_ARCH"
          )
          $info | Set-Content -Encoding ASCII C:\WinPE_amd64\BUILD_INFO.txt
          Get-Content C:\WinPE_amd64\BUILD_INFO.txt

      - name: Upload clean WinPE
        uses: actions/upload-artifact@v4
        with:
          name: clean-winpe-amd64
          path: |
            C:\WinPE_amd64\WinPE_amd64.iso
            C:\WinPE_amd64\BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
